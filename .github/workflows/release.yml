name: Build and Release Extension

on:
  push:
    branches:
      - main # Build on every push; the zip is uploaded as a workflow artifact
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension (Zip)
        run: |
          cd dist
          zip -r ../commitcode-extension.zip *
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: commitcode-extension
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: commitcode-extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false
